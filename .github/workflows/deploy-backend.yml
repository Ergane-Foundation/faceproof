name: Deploy backend

# Manual only: Actions tab > "Deploy backend" > "Run workflow". It never runs on
# push or pull_request, so contributors and forks cannot trigger a deployment.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets GitHub issue a short-lived OIDC token for AWS

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    # Only the maintainer's repository deploys; in any fork this job is skipped.
    if: github.repository == 'Ergane-Foundation/faceproof'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # OIDC: no AWS keys are stored in GitHub. Setup and the access-key
      # alternative are described in backend/README.md.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
        with:
          use-installer: true

      - name: Validate template
        run: sam validate --lint

      - name: Build
        run: sam build

      - name: Deploy
        run: sam deploy --no-progressbar

      - name: Smoke test (a request without a token must be refused)
        env:
          STACK_NAME: faceproof # must match stack_name in samconfig.toml
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL" \
            -H 'Content-Type: application/json' -d '{"records":[]}')
          echo "Unauthenticated POST returned $STATUS"
          test "$STATUS" = "401"
          echo "### Sync endpoint" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
